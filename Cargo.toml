[package]
name = "task-manager-kotter"
version = "1.0.3"
edition = "2024"
description = "A simple CLI task manager with a terminal UI"
license = "MIT"
repository = "https://github.com/lijkott/task-manager"
readme = "README.md"
keywords = ["cli", "task", "tui", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "tsk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
ratatui = "0.26"
crossterm = "0.27"
chrono = { version = "0.4", features = ["serde"] }
